<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Controle de Afastamentos">
    <title>Acesso administrativo · Controle de Afastamentos</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logomarca.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logomarca.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-panel">
        <img class="login-logo" src="{{ url_for('static', filename='logomarca.png') }}" alt="Logomarca corporativa">
        <p class="eyebrow">ACESSO RESTRITO</p>
        <h1>Controle de Afastamentos</h1>
        <p class="login-subtitle">Entre com suas credenciais administrativas.</p>

        {% if erro_login %}
        <div class="notice notice-error" role="alert">{{ erro_login }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            </div>
            <button type="submit" class="submit-button">Acessar painel <span aria-hidden="true">→</span></button>
        </form>
    </main>
</body>
</html>
